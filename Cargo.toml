[package]
name = "libfreesignal"
version = "0.1.0"
edition = "2024"

[dependencies]
x25519-dalek = { version = "2", features = ["static_secrets"] }
rand_core = { version = "0.6", features = ["getrandom"] }
hkdf = "0.12"
hmac = "0.12"
sha2 = "0.10"
aes-gcm = { version = "0.10", features = ["aes"] }
zeroize = { version = "1", features = ["derive"] }
ed25519-dalek = "2.2.0"
subtle = "2.6.1"
 
[dev-dependencies]
hex = "0.4"
